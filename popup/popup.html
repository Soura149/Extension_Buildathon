<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Overlayed</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="brand">
        <img class="brand-mark" src="../icons/icon32.png" alt="" width="28" height="28">
        <span>Overlayed</span>
      </header>
      <p id="status" class="status" role="status">Checking this page…</p>
      <button id="toggle-overlay" class="primary" type="button" disabled>
        Enable overlay
      </button>
      <button id="capture-snapshot" class="primary" type="button" disabled>Capture &amp; Annotate</button>
      <button id="capture-full-page" class="primary" type="button" disabled>Capture Full Page</button>
      <button id="saved-notes" class="secondary" type="button">Saved Notes</button>
      <button id="camera-test" class="secondary" type="button">Camera Test</button>
      <p class="hint">Use Browse mode for the page and Draw mode for mouse or trackpad annotations.</p>
      <p class="hint">Capture saves the visible viewport or the complete stable page, without the live overlay. Live drawings stay on the page; notes stay on this device.</p>
      <section class="recent-work" aria-labelledby="recent-work-heading">
        <h2 id="recent-work-heading">Recent saved work</h2>
        <p id="recent-status" class="hint" role="status">Loading saved work…</p>
        <ul id="recent-list" class="recent-list"></ul>
      </section>
    </main>
    <script src="../storage/notes.js"></script>
    <script src="popup.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AirWrite</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="brand">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span>AirWrite</span>
      </header>
      <p id="status" class="status" role="status">Checking this page…</p>
      <button id="toggle-overlay" class="primary" type="button" disabled>
        Enable overlay
      </button>
      <button id="capture-snapshot" class="primary" type="button" disabled>Capture &amp; Annotate</button>
      <button id="saved-notes" class="secondary" type="button">Saved Notes</button>
      <button id="camera-test" class="secondary" type="button">Camera Test</button>
      <p class="hint">Use Browse mode for the page and Draw mode for mouse or trackpad annotations.</p>
      <p class="hint">Capture saves only the visible viewport, without the live overlay. Live drawings stay on the page; notes stay on this device.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
